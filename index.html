<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Car Viewer</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #07090f; }
    canvas { display: block; }

    #hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #00d4ff;
      background: rgba(0, 12, 24, 0.7);
      border: 1px solid rgba(0, 200, 255, 0.25);
      border-radius: 3px;
      padding: 7px 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s, transform .3s;
      backdrop-filter: blur(6px);
    }
    #hint.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #info {
      position: fixed;
      bottom: 20px;
      right: 22px;
      font-family: 'Courier New', monospace;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(0, 180, 220, 0.3);
      line-height: 1.9;
      pointer-events: none;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="hint"></div>
  <div id="info">
    Click puerta → abrir / cerrar<br>
    Drag → rotar &nbsp;·&nbsp; Scroll → zoom<br>
    T → todas las puertas
  </div>

  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
